<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#021a14" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Outer Vinyl Rim -->
  <circle cx="64" cy="64" r="50" fill="#091410" stroke="#065f46" stroke-width="2" />
  
  <!-- Grooves -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#047857" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,2" />
  <circle cx="64" cy="64" r="38" fill="none" stroke="#059669" stroke-width="1.2" stroke-opacity="0.6" />
  <circle cx="64" cy="64" r="32" fill="none" stroke="#047857" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,3" />

  <!-- Vault Outer Gear / Cog Dial -->
  <circle cx="64" cy="64" r="25" fill="#064e3b" stroke="#34d399" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Dial Notches -->
  <circle cx="64" cy="42" r="2" fill="#6ee7b7" />
  <circle cx="86" cy="64" r="2" fill="#6ee7b7" />
  <circle cx="64" cy="86" r="2" fill="#6ee7b7" />
  <circle cx="42" cy="64" r="2" fill="#6ee7b7" />
  <circle cx="79.5" cy="48.5" r="1.5" fill="#34d399" />
  <circle cx="79.5" cy="79.5" r="1.5" fill="#34d399" />
  <circle cx="48.5" cy="79.5" r="1.5" fill="#34d399" />
  <circle cx="48.5" cy="48.5" r="1.5" fill="#34d399" />

  <!-- Center Vault Handle / Spindle -->
  <circle cx="64" cy="64" r="12" fill="url(#emeraldGrad)" stroke="#a7f3d0" stroke-width="1.5" />
  <circle cx="64" cy="64" r="4.5" fill="#022c22" stroke="#6ee7b7" stroke-width="1" />

  <!-- Handle spoke accents -->
  <line x1="64" y1="53" x2="64" y2="47" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  <line x1="75" y1="64" x2="81" y2="64" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  <line x1="64" y1="75" x2="64" y2="81" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  <line x1="53" y1="64" x2="47" y2="64" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
</svg>
